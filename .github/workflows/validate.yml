name: Validate OrbitAI

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/orbit-backend.js
      - name: Check whitespace errors
        run: git diff --check
